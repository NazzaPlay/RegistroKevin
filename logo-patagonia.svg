<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="patagoniaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E5E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Fondo circular oscuro -->
  <circle cx="32" cy="32" r="32" fill="#0a0a0c"/>
  <!-- Anillo exterior con gradiente cian-azul -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="url(#patagoniaGradient)" stroke-width="3"/>
  <!-- Anillo interior sutil -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Texto "PE" estilizado -->
  <text x="32" y="38" font-family="Orbitron, Rajdhani, sans-serif" font-size="18" font-weight="800" fill="url(#patagoniaGradient)" text-anchor="middle" letter-spacing="1">PE</text>
  <!-- Acento: líneas de velocidad -->
  <g stroke="url(#patagoniaGradient)" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <line x1="14" y1="22" x2="22" y2="22"/>
    <line x1="42" y1="22" x2="50" y2="22"/>
    <line x1="14" y1="42" x2="22" y2="42"/>
    <line x1="42" y1="42" x2="50" y2="42"/>
  </g>
  <!-- Pequeño triángulo/pointer racing -->
  <polygon points="32,12 28,18 36,18" fill="url(#patagoniaGradient)" opacity="0.9"/>
</svg>