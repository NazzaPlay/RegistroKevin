<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="textoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F7FA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00E5E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icono circular a la izquierda -->
  <circle cx="60" cy="60" r="50" fill="#0a0a0c"/>
  <circle cx="60" cy="60" r="46" fill="none" stroke="url(#accentGradient)" stroke-width="3"/>
  <text x="60" y="68" font-family="Orbitron, sans-serif" font-size="28" font-weight="900" fill="url(#accentGradient)" text-anchor="middle" letter-spacing="2">PE</text>
  <polygon points="60,20 54,28 66,28" fill="url(#accentGradient)"/>
  
  <!-- Texto principal: PATAGONIA ESPORTS -->
  <text x="130" y="55" font-family="Orbitron, sans-serif" font-size="32" font-weight="900" fill="url(#textoGradient)" letter-spacing="8">PATAGONIA</text>
  <text x="130" y="55" font-family="Orbitron, sans-serif" font-size="32" font-weight="900" fill="url(#textoGradient)" letter-spacing="8" dx="205">ESPORTS</text>
  
  <!-- Subtítulo: RACING ACADEMY -->
  <text x="132" y="85" font-family="Rajdhani, sans-serif" font-size="16" font-weight="700" fill="#00E5E0" letter-spacing="12">RACING ACADEMY</text>
  
  <!-- Línea decorativa debajo -->
  <line x1="130" y1="95" x2="380" y2="95" stroke="url(#accentGradient)" stroke-width="2" opacity="0.6"/>
</svg>